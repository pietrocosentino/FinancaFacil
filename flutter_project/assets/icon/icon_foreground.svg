<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scaled center icon for adaptive icon safe zone (centered in 1024x1024) -->
  <g transform="translate(512, 512) scale(0.72) translate(-512, -512)">
    <!-- Back card -->
    <rect x="300" y="250" width="460" height="300" rx="36" fill="#1E293B" opacity="0.85" transform="rotate(12 530 400)" stroke="#334155" stroke-width="4"/>
    <!-- Front card -->
    <rect x="230" y="320" width="480" height="310" rx="36" fill="#0F172A" stroke="url(#glowGrad)" stroke-width="6"/>

    <!-- Bars -->
    <rect x="310" y="480" width="44" height="90" rx="16" fill="#334155" opacity="0.8"/>
    <rect x="380" y="430" width="44" height="140" rx="16" fill="url(#accentGrad)" opacity="0.7"/>
    <rect x="450" y="380" width="44" height="190" rx="16" fill="url(#accentGrad)"/>
    <rect x="520" y="330" width="44" height="240" rx="16" fill="url(#glowGrad)"/>

    <!-- Upward Trend Line -->
    <path d="M 332 460 Q 430 420 542 300 L 610 260" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="625,250 575,255 605,295" fill="#34D399"/>

    <!-- Coin / Badge -->
    <g transform="translate(580, 480)">
      <circle cx="60" cy="60" r="68" fill="url(#accentGrad)"/>
      <circle cx="60" cy="60" r="56" fill="#064E3B"/>
      <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" fill="#ECFDF5" text-anchor="middle">$</text>
    </g>
  </g>
</svg>