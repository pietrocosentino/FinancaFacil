name: financafacil
description: "Aplicativo de gestão financeira pessoal FinançaFácil."
publish_to: "none"
version: 2.1.0+17

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Backend e autenticação
  supabase_flutter: ^2.15.4
  app_links: 6.3.2

  # Formatação monetária e de datas
  intl: ^0.20.3

  # Lembretes locais e fuso horário do aparelho
  flutter_local_notifications: 17.2.4
  flutter_timezone: 3.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.5.3
  image_picker: 1.1.2
  file_picker: 8.1.7
  archive: 3.6.1
  xml: 6.5.0
  crypto: ^3.0.3
  local_auth: ^3.0.2

dev_dependencies:
  # Cliente HTTP simulado nos testes de contrato dos repositórios.
  http: ^1.2.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/import/modelo_financafacil.xlsx
    - assets/icon/icon.png

